name: Deploy Morningfall

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy para HelioHost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: condadocarmesim.helioho.st
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /httpdocs/
          dangerous-clean-slate: false
          timeout: 600000
          exclude: |
            **/.git/**
            **/.github/**
            **/storage/backups/**
            **/*.zip
            **/.DS_Store
            **/Thumbs.db